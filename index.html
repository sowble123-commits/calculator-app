<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>계산기</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#5d9ba8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator-app" id="app">
    <!-- 상단 저장소 경고 바 -->
    <div class="storage-warning" id="storageWarning" style="display: none;">
      이 브라우저에서는 기록이 저장되지 않습니다
    </div>

    <!-- 계산기 디스플레이 영역 -->
    <div class="display-container" id="displayArea">
      <!-- 메모리 M 표시 -->
      <div class="memory-indicator" id="memoryIndicator" style="display: none;">M</div>

      <!-- 메인 결과 숫자 -->
      <div class="result-line-wrap">
        <div class="result-line" id="resultDisplay" title="길게 눌러 복사">0</div>
      </div>

      <!-- 작은 줄 (미리 결과 또는 직전 식) -->
      <div class="sub-expression-wrap">
        <div class="sub-expression" id="exprDisplay"></div>
      </div>

      <!-- 디스플레이 하단 정보 줄 (기록 아이콘, 손잡이) -->
      <div class="display-bottom-bar">
        <button type="button" class="history-toggle-btn" id="historyBtn" aria-label="계산 기록" title="계산 기록">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            <line x1="8" y1="9" x2="16" y2="9"></line>
            <line x1="8" y1="13" x2="14" y2="13"></line>
          </svg>
        </button>
        <div class="drag-handle" id="dragHandle" aria-hidden="true"></div>
      </div>
    </div>

    <!-- 단추 영역 (4열 6행) -->
    <div class="keypad-container" id="keypad">
      <!-- 1행: 메모리 줄 -->
      <button type="button" class="calc-btn btn-mem" data-key="mc">mc</button>
      <button type="button" class="calc-btn btn-mem" data-key="m+">m+</button>
      <button type="button" class="calc-btn btn-mem" data-key="m-">m-</button>
      <button type="button" class="calc-btn btn-mem" data-key="mr">mr</button>

      <!-- 2행: C, %, +/-, ÷ -->
      <button type="button" class="calc-btn btn-clear" data-key="C">C</button>
      <button type="button" class="calc-btn btn-func" data-key="%">%</button>
      <button type="button" class="calc-btn btn-func" data-key="+/-">+/-</button>
      <button type="button" class="calc-btn btn-op" data-key="÷">÷</button>

      <!-- 3행: 7, 8, 9, × -->
      <button type="button" class="calc-btn btn-num" data-key="7">7</button>
      <button type="button" class="calc-btn btn-num" data-key="8">8</button>
      <button type="button" class="calc-btn btn-num" data-key="9">9</button>
      <button type="button" class="calc-btn btn-op" data-key="×">×</button>

      <!-- 4행: 4, 5, 6, − -->
      <button type="button" class="calc-btn btn-num" data-key="4">4</button>
      <button type="button" class="calc-btn btn-num" data-key="5">5</button>
      <button type="button" class="calc-btn btn-num" data-key="6">6</button>
      <button type="button" class="calc-btn btn-op" data-key="−">−</button>

      <!-- 5행: 1, 2, 3, + -->
      <button type="button" class="calc-btn btn-num" data-key="1">1</button>
      <button type="button" class="calc-btn btn-num" data-key="2">2</button>
      <button type="button" class="calc-btn btn-num" data-key="3">3</button>
      <button type="button" class="calc-btn btn-op" data-key="+">+</button>

      <!-- 6행: 0, ., ⌫, = -->
      <button type="button" class="calc-btn btn-num" data-key="0">0</button>
      <button type="button" class="calc-btn btn-num" data-key=".">.</button>
      <button type="button" class="calc-btn btn-backspace" data-key="⌫" aria-label="지우기">
        <svg width="28" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"/>
        </svg>
      </button>
      <button type="button" class="calc-btn btn-equals" data-key="=">=</button>
    </div>

    <!-- 계산 기록 슬라이드 패널 -->
    <div class="history-panel" id="historyPanel">
      <div class="history-content">
        <!-- 상단 고정: 현재 숫자 (캡처 2와 같음) -->
        <div class="history-header-display">
          <div class="history-current-val" id="historyHeaderVal">0</div>
        </div>

        <!-- 카드 리스트 영역 -->
        <div class="history-list" id="historyList">
          <!-- JS로 동적 생성 -->
        </div>

        <!-- 빈 기록 안내 -->
        <div class="history-empty" id="historyEmpty" style="display: none;">
          계산 기록이 없습니다
        </div>
      </div>

      <!-- 하단 고정 액션 바 -->
      <div class="history-action-bar">
        <button type="button" class="history-bar-btn" id="clearHistoryBtn">내역 지우기</button>
        <button type="button" class="history-bar-btn" id="closeHistoryBtn">닫기</button>
      </div>
    </div>

    <!-- 더보기 컨텍스트 팝업 메뉴 -->
    <div class="more-menu-backdrop" id="moreMenuBackdrop" style="display: none;"></div>
    <div class="more-menu-popup" id="moreMenuPopup" style="display: none;">
      <button type="button" class="more-menu-item" id="menuItemNote">메모</button>
      <button type="button" class="more-menu-item" id="menuItemCopy">복사</button>
      <button type="button" class="more-menu-item" id="menuItemDelete">삭제</button>
    </div>

    <!-- 메모 모달 창 -->
    <div class="modal-backdrop" id="noteModal" style="display: none;">
      <div class="modal-dialog">
        <h3 class="modal-title">메모</h3>
        <div class="modal-body">
          <textarea id="noteInput" maxlength="50" placeholder="메모를 입력하세요 (최대 50자)" rows="3"></textarea>
          <div class="char-count"><span id="noteCharCount">0</span>/50</div>
        </div>
        <div class="modal-footer">
          <button type="button" class="modal-btn" id="noteCancelBtn">취소</button>
          <button type="button" class="modal-btn primary" id="noteSaveBtn">저장</button>
        </div>
      </div>
    </div>

    <!-- 전체 지우기 확인 모달 -->
    <div class="modal-backdrop" id="confirmModal" style="display: none;">
      <div class="modal-dialog">
        <div class="modal-body confirm-text">
          계산 기록을 모두 지울까요? 되돌릴 수 없습니다.
        </div>
        <div class="modal-footer">
          <button type="button" class="modal-btn" id="confirmCancelBtn">취소</button>
          <button type="button" class="modal-btn danger" id="confirmDeleteBtn">지우기</button>
        </div>
      </div>
    </div>

    <!-- 토스트 알림 메시지 (복사했습니다, 삭제했습니다 + 되돌리기) -->
    <div class="toast-container" id="toastContainer" style="display: none;">
      <span class="toast-message" id="toastMessage"></span>
      <button type="button" class="toast-action" id="toastAction" style="display: none;">되돌리기</button>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
